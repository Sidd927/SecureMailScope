<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecureMailScope — Analyst Console</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>

<header class="masthead">
  <div class="wrap masthead-inner">
    <div>
      <h1><a href="#/" class="brand">SecureMailScope</a></h1>
      <p class="tagline">Cryptographic Security Posture Assessment · Analyst Console</p>
    </div>
    <nav class="crumbs" aria-label="Breadcrumb">
      <ol id="crumbs"></ol>
    </nav>
  </div>
</header>

<nav class="tabs" id="run-tabs" hidden aria-label="Analysis views">
  <div class="wrap">
    <ul id="tab-list"></ul>
  </div>
</nav>

<main id="main" class="wrap" tabindex="-1">
  <!-- Views render here. Every node is created with createElement and filled with
       textContent; no markup is ever built from API data (doc 23 section 11). -->
</main>

<footer class="foot">
  <div class="wrap">
    <p id="foot-note">SecureMailScope · passive PCAP analysis · this console displays
      the canonical assessment and computes no security conclusion of its own.</p>
  </div>
</footer>

<script type="module" src="./app.js"></script>
<noscript>
  <div class="wrap notice">
    This console requires JavaScript. The same assessment is available without it:
    request the HTML or JSON report from the API directly.
  </div>
</noscript>
</body>
</html>
