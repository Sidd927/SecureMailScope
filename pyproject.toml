[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "securemailscope"
version = "0.1.0"
description = "Passive PCAP cryptographic security posture assessment for email (SIH26159)"
requires-python = ">=3.9"
# Core has ZERO runtime dependencies: the evidence model + tshark adapter use stdlib only.
# This keeps offline/air-gapped deployment simple (ADR-0011). Heavier deps (FastAPI, sklearn)
# arrive in their own phases behind optional extras.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
# Phase-8 backend. Optional by design: the core evidence/analysis/posture layers stay
# zero-dependency so offline and air-gapped use stays simple (ADR-0011).
backend = [
    "fastapi>=0.110",
    "pydantic>=2",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",   # required for multipart uploads
]
test-backend = ["httpx>=0.27"]   # FastAPI TestClient transport

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
